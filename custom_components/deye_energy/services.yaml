apply_settings:
  name: Apply settings
  description: Apply the Deye work mode and maximum sell power. Battery current limits are changed only in Inverter configuration.
  fields:
    mode:
      required: true
      selector:
        select:
          options:
            - Normal Operation
            - Selling
    sell_power:
      required: true
      selector:
        number:
          min: 0
          max: 30000
          step: 100
          unit_of_measurement: W
manual_sell:
  name: Manual sell
  description: Switch to Selling and apply manual sell limits.
  fields:
    sell_power:
      required: true
      selector:
        number:
          min: 0
          max: 30000
          step: 100
          unit_of_measurement: W
charge_now:
  name: Charge now
  description: Start charging the battery using the current limits already configured on the inverter.
stop_selling:
  name: Stop selling
  description: Latch manager control, apply the complete 1:1 Default settings set and never force numeric values to zero automatically.
restore_defaults:
  name: Restore default settings
  description: Manually apply the settings the user saved in the Default settings dialog.
resume_manager:
  name: Enable manager and schedule
  description: "Consciously re-enables Schedule mode and the scheduler after Stop Sell or an emergency stop. It does not change the template or existing Charging slots; only Grid Charge: YES stored in a specific Charging slot allows physical Grid Charge."
emergency_stop:
  name: Emergency stop
  description: Immediately latch manager control and apply the complete 1:1 set of the user's default settings, including the selected mode.
save_ai_settings:
  name: Save AI settings
  description: Save the settings used by the AI Suggestions window.
  fields:
    data:
      name: JSON data
      description: Strategy, threshold and planning parameters passed by the card.
      required: true
      selector:
        text:
          multiline: true
save_ai_profiles:
  name: Save Optimizer Core profiles
  description: Validate and save the Morning sale, Evening sale and Charging profiles. Nothing is written to the inverter.
  fields:
    data:
      name: Profiles JSON
      description: Complete, versioned set of user profiles.
      required: true
      selector:
        text:
          multiline: true
save_ai_api_settings:
  name: Save AI assistant settings
  description: Save private provider options in the Home Assistant config entry. The secret never appears in history or entity attributes.
  fields:
    data:
      name: JSON settings
      description: Provider, model, role, privacy options and optionally a new API key.
      required: true
      selector:
        text:
          multiline: true
test_ai_api:
  name: Test AI connection
  description: Send a safe test request without installation data.
analyze_ai_api:
  name: Analyse plan again
  description: Manually start the optional analysis of the latest local plan. The result remains advisory.
save_ai_analysis:
  name: Save AI analysis
  description: Save the comparison of the AI plan with actual production and prices.
  fields:
    data:
      name: JSON data
      description: Dated analysis generated by the AI Suggestions window.
      required: true
      selector:
        text:
          multiline: true
clear_ai_history:
  name: Clear AI history
  description: Remove the history of AI analyses and suggestions.
rate_ai_analysis:
  name: Rate AI suggestion
  description: Save a rating for the selected AI suggestion.
  fields:
    timestamp:
      required: true
      selector:
        number:
    rating:
      required: true
      selector:
        number:
          min: 1
          max: 5
          step: 1
clear_history:
  name: Clear history and data
  description: Remove the history of suggestions, learning and Solcast comparisons.
apply_schedule_patch:
  name: Apply schedule patch
  description: Atomically validate Schedule changes. A list keeps partial-patch semantics; an Apply Today object with replace_day=true builds an authoritative 24 h plan and sets the remaining hours to Normal Operation.
  fields:
    data:
      required: true
      selector:
        text:
          multiline: true
save_tariff_settings:
  name: Save tariff and distribution settings
  description: Validate and save the DSO provider, tariff, price sources and power-flow signs passed by the card.
  fields:
    data:
      required: true
      selector:
        text:
          multiline: true
save_charge_profile:
  name: Save charging settings
  description: Save the template copied when Charging mode is selected later. Existing schedule slots are not overwritten.
  fields:
    grid_charge_enabled:
      required: true
      description: "Initial value copied into a new Charging slot. After copying, only Grid Charge: YES stored in that specific Charging slot allows physical Grid Charge; a positive current is not consent."
      selector:
        boolean:
    target_soc:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
save_normal_profile:
  name: Save normal operation settings
  description: Save the template copied when Normal Operation mode is selected later. Existing Normal Operation slots are not overwritten.
  fields:
    physical_work_mode:
      required: true
      description: Physical Deye mode sent to the work-mode select entity for Normal Operation slots.
      selector:
        select:
          options:
            - Zero Export To Load
            - Zero Export To CT
    sell_power:
      required: true
      selector:
        number:
          min: 0
          max: 30000
          step: 1
          unit_of_measurement: W
    tou_soc:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
save_default_settings:
  name: Save inverter default settings
  description: Save the user's complete fallback state without writing to the inverter immediately. It is applied only deliberately or after a control error.
  fields:
    mode:
      required: true
      selector:
        select:
          options:
            - Normal Operation
            - Selling
    physical_work_mode:
      name: Physical Normal Operation variant
      description: Canonical variant translated by the adapter into the raw option of the active provider. It does not change the logical default mode.
      required: false
      selector:
        select:
          options:
            - Zero Export To Load
            - Zero Export To CT
    sell_power:
      required: true
      selector:
        number:
          min: 0
          max: 30000
          step: 1
          unit_of_measurement: W
refresh_tariff_catalog:
  name: Refresh DSO tariff catalog
  description: Check the versioned tariff catalog. On error the last valid or bundled version is kept.
save_future_plan:
  name: Save AI plan for tomorrow
  description: Save a dated, manually approved plan for tomorrow without immediately changing the recurring Deye schedule.
  fields:
    data:
      name: Plan JSON
      description: Plan date, selected hours and exact values approved by the user.
      required: true
      selector:
        text:
          multiline: true
cancel_future_plan:
  name: Cancel AI plan for tomorrow
  description: Cancel the pending plan for tomorrow. The current schedule is not changed.

get_plan_execution:
  name: Get plan and execution
  description: Return a read-only frozen plan and execution measurements for the selected day.
  fields:
    date:
      name: Date
      description: Local date in YYYY-MM-DD format. Empty means today.
      required: false
      selector:
        date:

set_tou_slot:
  name: Set physical Deye Time Of Use slot
  description: Write and confirm only the supplied fields of one physical slot through the selected communication adapter. At least one field must be provided. Start and End must be on a :00 or :30 boundary.
  fields:
    slot:
      name: Slot
      required: true
      selector:
        number:
          min: 1
          max: 6
          step: 1
    start:
      name: Start
      required: false
      selector:
        time:
    end:
      name: End
      required: false
      selector:
        time:
    soc:
      name: SOC
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    grid_charge:
      name: Grid charge
      required: false
      selector:
        boolean:
    mode:
      name: Mode
      required: false
      selector:
        text:
    charge:
      name: Charge
      required: false
      selector:
        text:
    sell:
      name: Sell
      required: false
      selector:
        boolean:
    power:
      name: Power
      required: false
      selector:
        number:
          min: 0
          max: 200000
          step: 1
          unit_of_measurement: W
    voltage:
      name: Voltage
      required: false
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          unit_of_measurement: V

save_manual_schedule:
  name: Save manual schedule
  description: Save the complete manual schedule rows without activating them. Rows must cover the full 24 hours without gaps or overlaps.
  fields:
    data:
      name: Rows JSON
      description: JSON array of manual schedule rows, or an object with a rows array.
      required: true
      selector:
        text:
          multiline: true

init_manual_schedule_from_tou:
  name: Initialize manual schedule from Time Of Use
  description: Replace the manual schedule rows with the current six physical Deye Time Of Use ranges.

activate_manual_schedule:
  name: Activate manual schedule
  description: Map the manual schedule rows onto the 48 work schedule slots and make them final until deactivated. AI, optimizer and future-plan applies are blocked while active.

deactivate_manual_schedule:
  name: Deactivate manual schedule
  description: Restore the work schedule that was saved before the manual schedule was activated.

save_energy_status_display:
  name: Save Energy status sensor display
  description: Save the card's Energy status sensor source-entity overrides, visibility choices, and PV generation toggle (pv_enabled). Unknown sensor roles are rejected.
  fields:
    data:
      name: Display configuration JSON
      description: JSON object with optional "pv_enabled" (boolean, default true), "mappings" (role to entity id), and "visibility" (role to boolean) objects.
      required: true
      selector:
        text:
          multiline: true

get_inverter_configuration:
  name: Get inverter configuration
  description: Return all inverter configuration groups with live values, metadata and writability. Unmapped or unavailable fields are returned read-only.

apply_inverter_configuration_group:
  name: Apply inverter configuration group
  description: Validate and write one group of inverter configuration fields. All values are prevalidated against live entity metadata; writes stop at the first failure.
  fields:
    group:
      name: Group
      required: true
      selector:
        select:
          options:
            - specification
            - grid
            - auxiliary
            - battery_type
            - battery_charging
            - battery_config
            - work_mode
            - work_mode_detail
            - system_control
    values:
      name: Values
      description: Object keyed by configuration field key. Only writable fields in the selected group are applied.
      required: true
      selector:
        object:

sync_inverter_datetime:
  name: Sync inverter datetime
  description: Force-sync the Home Assistant server time to the configured inverter datetime entity. Returns the sync result and current datetime status.

get_power_flow_display:
  name: Get Power Flow display configuration
  description: Return the effective Power Flow sensor mappings, sensor groups, node detail rows and chip row definitions.

save_power_flow_display:
  name: Save Power Flow display configuration
  description: Save Power Flow sensor entity overrides, extra node detail rows and extra chip rows to the shared entity-map override file. Only the power_flow section is changed.
  fields:
    data:
      name: Display configuration JSON
      description: JSON object with optional schema_version, entities, node_details and chip_rows. Unknown keys and invalid entity ids are rejected.
      required: true
      selector:
        text:
          multiline: true
